# Live ISO menu. Smart boot is the default for VMs and real hardware.
set timeout=5
set default="GooberOSx86 (Smart boot)"

if loadfont /boot/grub/fonts/unicode.pf2 ; then
    insmod all_video
    insmod gfxterm
    set gfxmode=auto
    set gfxpayload=keep
    terminal_output gfxterm
fi

menuentry "GooberOSx86 (Smart boot)" {
    insmod all_video
    set gfxmode=auto
    set gfxpayload=keep
    multiboot2 /boot/kernel.bin gooberos.boot=smart gooberos.theme=dark
    module2 /boot/install/FAT_PART.IMG
    boot
}

# Keep USB inserted: boot the GOOBEROS volume already installed on disk/eMMC.
menuentry "GooberOSx86 (Boot installed disk)" {
    insmod all_video
    insmod part_gpt
    insmod part_msdos
    insmod fat
    insmod search_label
    set gfxmode=auto
    set gfxpayload=keep
    search --no-floppy --set=root --label GOOBEROS
    multiboot2 /boot/kernel.bin gooberos.boot=smart gooberos.theme=dark gooberos.root=auto
    boot
}

# UEFI only: chainload the installed ESP bootloader.
menuentry "GooberOSx86 (Chainload installed EFI)" {
    insmod part_gpt
    insmod part_msdos
    insmod fat
    insmod search_label
    search --no-floppy --set=root --label GOOBEROS
    if [ -f /EFI/GooberOS/BOOTX64.EFI ]; then
        chainloader /EFI/GooberOS/BOOTX64.EFI
    elif [ -f /EFI/GooberOS/BOOTIA32.EFI ]; then
        chainloader /EFI/GooberOS/BOOTIA32.EFI
    elif [ -f /EFI/BOOT/BOOTX64.EFI ]; then
        chainloader /EFI/BOOT/BOOTX64.EFI
    elif [ -f /EFI/BOOT/BOOTIA32.EFI ]; then
        chainloader /EFI/BOOT/BOOTIA32.EFI
    else
        echo "No EFI bootloader on GOOBEROS volume"
        sleep 3
    fi
    boot
}

menuentry "GooberOSx86 (Safe graphics)" {
    insmod all_video
    set gfxmode=auto
    set gfxpayload=keep
    multiboot2 /boot/kernel.bin gooberos.boot=vesa-auto gooberos.display=basic gooberos.vbe=off gooberos.theme=dark
    module2 /boot/install/FAT_PART.IMG
    boot
}

menuentry "GooberOSx86 (Text console)" {
    insmod all_video
    set gfxmode=auto
    set gfxpayload=keep
    multiboot2 /boot/kernel.bin gooberos.boot=vga
    module2 /boot/install/FAT_PART.IMG
    boot
}
