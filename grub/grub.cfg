# Live ISO menu. Smart boot uses a low-bandwidth GOP mode for Braswell.
set timeout=5
set default="GooberOSx86 (Smart boot)"

if loadfont /boot/grub/fonts/unicode.pf2 ; then
    insmod all_video
    insmod gfxterm
    set gfxmode=800x600x32,800x600,auto
    set gfxpayload=keep
    terminal_output gfxterm
fi

menuentry "GooberOSx86 (Smart boot)" {
    insmod all_video
    set gfxmode=800x600x32,800x600,auto
    set gfxpayload=keep
    multiboot2 /boot/kernel.bin gooberos.boot=smart gooberos.theme=dark
    module2 /boot/install/FAT_PART.IMG
    boot
}

# Serial-debug variant: identical to Smart boot but arms gooberos.debug=1 so
# the desktop enables COM1 TX and emits diagnostics to the VM's COM1 raw-file
# capture. Kept as an option for future debugging; edit the line or pick this
# entry only when you need serial output.
menuentry "GooberOSx86 (Serial debug)" {
    insmod all_video
    set gfxmode=800x600x32,800x600,auto
    set gfxpayload=keep
    multiboot2 /boot/kernel.bin gooberos.boot=smart gooberos.theme=dark gooberos.debug=1
    module2 /boot/install/FAT_PART.IMG
    boot
}

# Keep USB inserted: boot the GOOBEROS volume already installed on disk/eMMC.
menuentry "GooberOSx86 (Boot installed disk)" {
    insmod all_video
    insmod part_gpt
    insmod part_msdos
    insmod fat
    insmod search_label
    set gfxmode=800x600x32,800x600,auto
    set gfxpayload=keep
    search --no-floppy --set=root --label GOOBEROS
    multiboot2 /boot/kernel.bin gooberos.boot=smart gooberos.theme=dark gooberos.root=auto
    boot
}

# UEFI only: chainload the installed ESP bootloader.
menuentry "GooberOSx86 (Chainload installed EFI)" {
    insmod part_gpt
    insmod part_msdos
    insmod fat
    insmod search_label
    search --no-floppy --set=root --label GOOBEROS
    if [ -f /EFI/GooberOS/BOOTX64.EFI ]; then
        chainloader /EFI/GooberOS/BOOTX64.EFI
    elif [ -f /EFI/GooberOS/BOOTIA32.EFI ]; then
        chainloader /EFI/GooberOS/BOOTIA32.EFI
    elif [ -f /EFI/BOOT/BOOTX64.EFI ]; then
        chainloader /EFI/BOOT/BOOTX64.EFI
    elif [ -f /EFI/BOOT/BOOTIA32.EFI ]; then
        chainloader /EFI/BOOT/BOOTIA32.EFI
    else
        echo "No EFI bootloader on GOOBEROS volume"
        sleep 3
    fi
    boot
}

menuentry "GooberOSx86 (Safe graphics)" {
    insmod all_video
    set gfxmode=800x600x32,800x600,auto
    set gfxpayload=keep
    multiboot2 /boot/kernel.bin gooberos.boot=vesa-auto gooberos.display=basic gooberos.vbe=off gooberos.theme=dark
    module2 /boot/install/FAT_PART.IMG
    boot
}

menuentry "GooberOSx86 (Text console)" {
    set gfxpayload=text
    multiboot2 /boot/kernel.bin gooberos.boot=vga
    module2 /boot/install/FAT_PART.IMG
    boot
}

# v86 / minimal VGA frontends that only display the 0xB8000 text plane (not
# GRUB's inherited GOP framebuffer). Use this entry when Smart boot shows a
# black panel after GRUB. Serial output is on COM1 / the 0xE9 debug port.
menuentry "GooberOSx86 (v86 compatible)" {
    set gfxpayload=text
    multiboot2 /boot/kernel.bin gooberos.boot=v86 gooberos.safe=1
    module2 /boot/install/FAT_PART.IMG
    boot
}
