# Early config for BIOS core.img (MBR install: part_msdos + search_label).
# part_gpt is included so a mis-partitioned disk is still searchable.
insmod part_msdos
insmod part_gpt
insmod fat
insmod search_label
search --no-floppy --set=root --label GOOBEROS
if [ -z "$root" ]; then
  echo "GOOBEROS volume not found; check install completed."
  sleep 3
fi
