# Installed GooberOS (MBR memdisk or UEFI ESP grub.cfg).
# Smart boot is the default. Config/grub-boot.cfg may override timeout.
set timeout=3
set default=0

search --no-floppy --set=root --label GOOBEROS
if [ -f ($root)/Config/grub-boot.cfg ]; then
    source ($root)/Config/grub-boot.cfg
fi

menuentry "GooberOS x86 (Smart boot)" {
    set gfxmode=800x600x32,800x600,auto
    set gfxpayload=keep
    search --no-floppy --set=root --label GOOBEROS
    echo "Loading GooberOS x86..."
    multiboot2 /boot/kernel.bin gooberos.boot=smart gooberos.theme=dark gooberos.root=auto
    boot
}

menuentry "GooberOS x86 (Safe graphics)" {
    set gfxmode=800x600x32,800x600,auto
    set gfxpayload=keep
    search --no-floppy --set=root --label GOOBEROS
    echo "Loading GooberOS x86 (safe)..."
    multiboot2 /boot/kernel.bin gooberos.boot=vesa-auto gooberos.display=basic gooberos.vbe=off gooberos.theme=dark gooberos.root=auto
    boot
}

menuentry "GooberOS x86 (Text console)" {
    set gfxpayload=keep
    search --no-floppy --set=root --label GOOBEROS
    echo "Loading GooberOS x86 (text)..."
    multiboot2 /boot/kernel.bin gooberos.boot=vga gooberos.root=auto
    boot
}
