set timeout=0
set default="GooberOSx86 (Normal boot)"

# Pull in every available video driver up front so gfxterm can use the mode the
# panel prefers. On Intel HD hardware this registers both vbe and the native
# driver; the kernel's auto display path picks from there.
if loadfont /boot/grub/fonts/unicode.pf2 ; then
    insmod all_video
    insmod gfxterm
    set gfxmode=auto
    set gfxpayload=keep
    terminal_output gfxterm
fi

# =========================================================================
# Five-entry menu. "Normal boot" is the full auto-detect path (VESA firmware
# framebuffer + Intel handled inside the kernel, plus USB). Every other entry
# is a progressively more conservative fallback. The USB host stage runs under
# a hard watchdog, so even if USB enumeration stalls the boot always proceeds.
# =========================================================================

# ----- Normal boot (auto-detect display + USB) ---------------------------
# Phase 4 (display polish): gooberos.display.fps=N tunes the desktop's
# frame pacing target (default 60 Hz when unset).
menuentry "GooberOSx86 (Normal boot)" {
    insmod all_video
    set gfxmode=auto
    set gfxpayload=keep
    multiboot2 /boot/kernel.bin gooberos.boot=vesa-auto gooberos.theme=dark gooberos.display.confirm=skip gooberos.display.fps=100
    boot
}

# ----- 1366x768 laptop panel ---------------------------------------------
# Acer R3-131T-class panels often look best when GRUB/GOP is asked for the
# native 1366x768 mode before the kernel adopts the firmware framebuffer.
menuentry "GooberOSx86 (1366x768 laptop panel)" {
    insmod all_video
    set gfxmode=1366x768x32,1366x768,auto
    set gfxpayload=keep
    multiboot2 /boot/kernel.bin gooberos.boot=vesa-auto gooberos.native=1366x768 gooberos.theme=dark gooberos.display.confirm=skip gooberos.display.fps=100
    boot
}

# ----- Graphics safe mode (firmware FB + auto-revert) --------------------
# Adopts ONLY the framebuffer the firmware/GRUB already programmed (no
# aggressive in-kernel driver), arms the visibility probe, and forces the
# on-panel confirm-or-revert gate: if you do not press a key the kernel
# restores VGA text, so you are never stranded on a black panel.
menuentry "GooberOSx86 (Graphics safe mode)" {
    insmod all_video
    set gfxmode=auto
    set gfxpayload=keep
    multiboot2 /boot/kernel.bin gooberos.boot=vesa-auto gooberos.display=safe gooberos.theme=dark gooberos.display.confirm=force
    boot
}

# ----- Generic framebuffer (Bochs/QEMU/VBox dispi) -----------------------
# In-kernel Bochs Dispi (BGA) modeset over I/O ports 0x1CE/0x1CF, adopting the
# PCI LFB aperture. Use in virtual machines if the firmware-preferred mode
# misbehaves. gfxpayload=text lets the kernel do the modeset itself.
menuentry "GooberOSx86 (Generic framebuffer -- Bochs/QEMU)" {
    set gfxpayload=text
    multiboot2 /boot/kernel.bin gooberos.boot=vesa-auto gooberos.display=bochs gooberos.theme=dark gooberos.display.confirm=skip
    boot
}

# ----- PS/2 boot (USB disabled) ------------------------------------------
# VESA graphics with the USB host stack disabled entirely (gooberos.usb=off).
# Lets you test the VESA desktop on PS/2 input alone, bypassing USB host
# bring-up -- handy when USB enumeration is misbehaving on real hardware.
menuentry "GooberOSx86 (PS/2 boot -- USB disabled)" {
    insmod all_video
    set gfxmode=auto
    set gfxpayload=keep
    multiboot2 /boot/kernel.bin gooberos.boot=vesa-auto gooberos.usb=off gooberos.theme=dark gooberos.display.confirm=skip
    boot
}

# ----- VGA compatibility -------------------------------------------------
# Legacy 80x25 VGA text plane (multiboot1, no video tag). Guaranteed
# visible on any platform that exposes the 0xB8000 text plane, i.e. any
# legacy-BIOS boot. The kernel commits to its 80x25 text-console layer
# (textcon) and runs the full interactive text shell from kernel_main
# on top of it; on x86 this path is byte-equivalent to the pre-textcon
# behaviour. Under UEFI the legacy text plane is unmapped, so this
# entry will produce a dark panel -- pick "VGA shell (framebuffer)"
# instead in that case.
menuentry "GooberOSx86 (VGA compatibility)" {
    set gfxpayload=text
    multiboot /boot/kernel.bin gooberos.boot=vga
    boot
}

# ----- VGA shell (framebuffer / UEFI) ------------------------------------
# Same 80x25 text shell as the VGA-Compatibility entry above, but
# delivered through the inherited firmware framebuffer instead of the
# legacy 0xB8000 plane. The kernel binds the textcon FB backend and
# renders the cell grid via the 8x16 font into the top-left 640x400
# region of the panel. This is the visible-text-shell path on UEFI
# (where 0xB8000 is not mapped). On legacy BIOS it also works, just
# via a graphical hand-off (an 8x16 monospace font on whatever
# framebuffer GRUB negotiated).
menuentry "GooberOSx86 (VGA shell -- framebuffer / UEFI)" {
    insmod all_video
    set gfxmode=auto
    set gfxpayload=keep
    multiboot2 /boot/kernel.bin gooberos.boot=vga
    boot
}

# ----- VGA mode-13h graphics fallback ------------------------------------
# Phase 4 (item 3): forces the VGA-graphics rung (320x200x8 indexed
# colour at 0xA0000). Useful when LFB-class drivers all reject the
# panel; renders a minimal status screen via desktop_vga13_render().
# When mode-13h itself fails to program (typical on pure-UEFI GPUs that
# do not back the legacy aperture), the kernel falls through to the
# textcon text-console layer rather than leaving a dark panel.
menuentry "GooberOSx86 (VGA mode-13h graphics)" {
    set gfxpayload=text
    multiboot /boot/kernel.bin gooberos.boot=vesa-auto gooberos.display=vga-graphics
    boot
}

# ----- VGA text-only floor (bypass mode-13h) -----------------------------
# Phase 4 (item 3): explicit 80x25 text floor. Same path as the VGA
# compatibility entry; the only difference is the gooberos.boot value
# (text-only is honoured by gooberos.display=vga-text without flipping
# the VGA-compat boot=vga branch).
menuentry "GooberOSx86 (VGA text-only floor)" {
    set gfxpayload=text
    multiboot /boot/kernel.bin gooberos.boot=vesa-auto gooberos.display=vga-text
    boot
}
